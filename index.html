<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
<title>จองคิว — แพลตฟอร์มจองคิวร้านค้าทุกประเภท</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<nav class="navbar navbar-expand-lg site-navbar">
  <div class="container">
    <a class="navbar-brand brand d-flex align-items-center gap-2" href="index.html">
      <img src="assets/logo.svg" alt="จองคิว" width="34" height="34">
      <span>จอง<span class="dot">คิว</span></span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse justify-content-end" id="navContent">
      <div class="d-flex align-items-center gap-2 py-2 py-lg-0 flex-wrap" id="navUser"></div>
    </div>
  </div>
</nav>

<header class="hero">
  <span class="eyebrow">แพลตฟอร์มจองคิวออนไลน์</span>
  <h1>จองคิวร้านที่ใช่<br>ได้ในไม่กี่คลิก</h1>
  <p class="lead mx-auto">ค้นหาและจองคิวร้านเสริมสวย คลินิก ร้านอาหาร ฟิตเนส และอีกมากมาย ครบในที่เดียว</p>

  <form class="search-bar input-group input-group-lg" id="searchForm">
    <input type="text" id="searchInput" class="form-control" placeholder="ค้นหาชื่อร้าน หรือประเภทร้าน..." />
    <button type="submit" class="btn btn-primary"><i class="bi bi-search"></i> ค้นหา</button>
  </form>

  <div class="d-flex flex-wrap justify-content-center gap-2 mt-4" id="categoryChips"></div>
</header>

<main class="container pb-5">
  <div class="d-flex align-items-baseline justify-content-between mt-4 mb-2 flex-wrap">
    <h2 class="mb-0" id="resultTitle">ร้านค้าทั้งหมด</h2>
    <p class="mb-0 text-secondary" id="resultCount"></p>
  </div>

  <div id="shopGrid" class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-4 mt-1">
    <div class="loader">กำลังโหลดร้านค้า...</div>
  </div>
</main>

<footer class="site-footer">
  จองคิว — ระบบสาธิตที่สร้างด้วย Supabase + Bootstrap 5 · สำหรับผู้ขายที่ต้องการเปิดร้าน <a href="login.html">สมัครเป็นผู้ขาย</a>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="js/shops.js"></script>
</body>
</html>
